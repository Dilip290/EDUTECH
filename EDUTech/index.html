<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>EduTech – Learn. Grow. Succeed.</title>
  <meta name="description" content="EduTech is an advanced learning platform with world-class courses." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/courses.css" />
  <link rel="stylesheet" href="css/video.css" />
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Identity Services for OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ─── SPA Shell ─────────────────────────────────────────── */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .page-transition {
      animation: viewFadeIn 0.25s ease;
    }

    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── Enhanced Course Grid ─────────────────────────────── */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .course-card-v2 {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .course-card-v2:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.15);
      border-color: var(--primary-light);
    }

    .cc-thumb {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
    }

    .cc-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cc-badge.free {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .cc-badge.paid {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .cc-body {
      padding: 1rem 1.15rem 1.25rem;
    }

    .cc-category {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
    }

    .cc-title-v2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cc-instructor {
      font-size: 0.78rem;
      color: var(--text3);
      margin-bottom: 0.6rem;
    }

    .cc-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: var(--text3);
      margin-bottom: 0.75rem;
    }

    .cc-rating {
      display: flex;
      align-items: center;
      gap: 3px;
      color: #f59e0b;
      font-weight: 700;
    }

    .cc-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border2);
    }

    .cc-price-v2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }

    .cc-price-v2.free {
      color: var(--green);
    }

    .cc-price-v2 .original {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: line-through;
      font-weight: 400;
      margin-left: 6px;
    }

    .cc-enroll-btn {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.2s ease;
    }

    .cc-enroll-btn.primary {
      background: var(--primary-light);
      color: white;
    }

    .cc-enroll-btn.primary:hover {
      background: var(--primary);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .cc-enroll-btn.enrolled {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
    }

    /* ─── Filters Bar ──────────────────────────────────────── */
    .filters-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-chip {
      padding: 7px 16px;
      border-radius: 99px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text2);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.2s ease;
    }

    .filter-chip:hover {
      border-color: var(--primary-light);
      color: var(--accent2);
    }

    .filter-chip.active {
      background: rgba(124, 58, 237, 0.15);
      border-color: var(--primary-light);
      color: var(--accent2);
    }

    /* ─── Course Detail View ───────────────────────────────── */
    .course-detail-hero {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .cdh-breadcrumb {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 1rem;
    }

    .cdh-breadcrumb a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
    }

    .cdh-breadcrumb a:hover {
      color: white;
    }

    .cdh-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .cdh-desc {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 1rem;
      max-width: 600px;
    }

    .cdh-meta {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .cdh-meta strong {
      color: white;
    }

    /* ─── Stats Cards ──────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card-v2 {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon-v2 {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .stat-info-v2 .stat-label-v2 {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-info-v2 .stat-val-v2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
    }

    /* ─── Payment Overlay ──────────────────────────────────── */
    .payment-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      padding: 1rem;
      animation: fadeIn 0.2s ease;
    }

    .payment-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .payment-card .pm-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border2);
    }

    .payment-card .pm-body {
      padding: 1.5rem;
    }

    .payment-card .pm-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ─── Section Headers ──────────────────────────────────── */
    .view-header {
      margin-bottom: 1.5rem;
    }

    .view-header h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .view-header p {
      font-size: 0.85rem;
      color: var(--text3);
    }

    /* ─── Enrolled cards ───────────────────────────────────── */
    .enrolled-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
  </style>
</head>

<body>
  <!-- ─── Toast Notification ─── -->
  <div id="toast" class="hidden"
    style="position:fixed;bottom:2rem;right:2rem;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:12px;font-size:0.88rem;font-weight:600;font-family:var(--font);z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.4);">
  </div>

  <!-- ─── SPA Application Root ── -->
  <div id="app"></div>

  <!-- Scripts -->
  <script>
    if (!window.location.search.includes('v=8.1')) {
      window.location.replace('?v=8.1' + window.location.hash);
    }
    // Apply saved theme ASAP to avoid flash of wrong theme
    (function () {
      const t = localStorage.getItem('edutech_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="js/data.js?v=8.1"></script>
  <script src="js/supabase.js?v=8.1"></script>
  <script src="js/views.js?v=8.1"></script>
  <script src="js/admin_views.js?v=8.1"></script>
  <script src="js/live_classes.js?v=8.1"></script>
  <script src="js/app.js?v=8.1"></script>
</body>

</html>
